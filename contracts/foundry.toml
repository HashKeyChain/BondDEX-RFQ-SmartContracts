[profile.default]
src = "src"
test = "test"
script = "script"
out = "out"
libs = ["lib"]
solc_version = "0.8.28"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
ffi = true
fs_permissions = [
  { access = "read", path = "out" },
  { access = "read", path = "../config" },
  { access = "read-write", path = "../abi-export" },
  { access = "read-write", path = "../deployments" }
]

[fuzz]
runs = 10000
max_test_rejects = 65536

[invariant]
runs = 256
depth = 100
fail_on_revert = false

[fmt]
line_length = 100
tab_width = 4
bracket_spacing = true
quote_style = "double"
